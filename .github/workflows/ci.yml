name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
        go: ['1.27.3']
    runs-on: ${{ matrix.os }}
    env:
      # Run every platform with the patched toolchain.
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install github.com/daixiang0/gci@v0.14.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: go test ./...

      - name: Coverage gate (macOS)
        if: runner.os == 'macOS'
        run: make cover-check
