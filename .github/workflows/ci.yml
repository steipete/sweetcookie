name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.14']
        include:
          - os: ubuntu-latest
            go: '1.25.0'
    runs-on: ${{ matrix.os }}
    env:
      # Keep the minimum-version job from selecting the preferred toolchain.
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Install tools
        env:
          # Tool builds may need a newer Go version than the library supports.
          GOTOOLCHAIN: auto
        run: |
          go install mvdan.cc/gofumpt@v0.11.0
          go install github.com/daixiang0/gci@v0.14.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Format check
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test
        run: go test ./...

      - name: Coverage gate (macOS)
        if: matrix.os == 'macos-latest'
        run: make cover-check
